# 사용: uv run stv-train --config configs/sample.toml
#       uv run stv-infer --config configs/sample.toml --split test
# 키 = src/stv/config.py의 Config 필드명. CLI 플래그가 이 파일보다 우선합니다.
# RTX 5060 Ti 16GB 실측: 학습 약 2시간 20분(검증 평가 포함) + test 추론(TTA 2회) 약 2시간.

model_id = "unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit"   # 8B: 학습·추론 약 2배, batch_size 1 / grad_accum 8 권장
data_dir = "data"
output_dir = "outputs/qwen3_vl_4b"
seed = 42

# 해상도 (원본 720x960이 1024² 예산에 그대로 들어감. 768²까지는 zero-shot 점수 동일)
train_max_pixels = 1048576
infer_max_pixels = 1048576
min_pixels = 131072
max_seq_len = 4096

# data
max_train_samples = 0        # 0이면 전체(약 6.2천). 빠른 실험은 1000
valid_size = 500             # train.csv에서 떼어 둘 검증 문항 수 (바꾸면 다른 실험·공개 어댑터와 비교 불가)
split_seed = 42              # 바꾸지 않기
use_dev = false              # dev 다수결 라벨은 노이즈가 커서 학습에 쓰지 않음
dev_min_votes = 3
shuffle_options = true       # 보기 순서 섞기 증강
prompt_variant = "a"         # a | b(글자 읽기 강조) | c(한국어 시스템 프롬프트)

# LoRA
lora_r = 16
lora_alpha = 16
finetune_vision = true       # OOM이면 false
init_adapter = ""            # "ssafyjinhyeok/KFC" = 공개 어댑터(검증 94.4%)에서 이어서 학습 (lr 자동 5e-5)

# train
epochs = 1.0
batch_size = 2               # OOM이면 1 / grad_accum 8
grad_accum = 4
lr = 0                       # 0 = 자동 (처음부터 1e-4, 이어서 5e-5)
eval_steps = 150             # 검증 1회 약 3분

# inference
adapter_dir = ""             # ""=output_dir의 adapter, "none"=zero-shot(init_adapter가 있으면 그 어댑터)
split = "test"               # test | valid | dev (dev는 answer1~5 다수결, 동률 제외로 채점)
max_infer_samples = 0        # 0이면 전체
infer_batch_size = 4
n_tta = 2                    # 보기 순서 TTA 횟수 (1 = 끔, 4 = 약 2배 시간)
