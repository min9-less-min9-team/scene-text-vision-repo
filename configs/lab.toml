# Docker Jupyter lab용. sample.toml과 다른 점은 model_id뿐입니다.
# 컨테이너의 HF 미러(HF_ENDPOINT=peer:8090)가 닿지 않아 HF 캐시에 이미 있는 모델을 오프라인으로 씁니다.
# (scripts/env.sh가 lab에서 HF_HUB_OFFLINE=1 설정. 캐시: Qwen/Qwen2.5-VL-3B-Instruct, unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit)

model_id = "Qwen/Qwen2.5-VL-3B-Instruct"   # bf16 가중치를 로드 시 4bit로 양자화
data_dir = "data"
output_dir = "outputs/qwen2_5_vl_3b_lora"
seed = 42

max_train_samples = 200
valid_ratio = 0.1

lora_r = 8
lora_alpha = 16
finetune_vision = false

epochs = 1.0
batch_size = 1
grad_accum = 4
lr = 1e-4

adapter_dir = ""
split = "test"
max_infer_samples = 0
