[project]
name = "stv"
version = "0.1.0"
description = "Scene-text VQA (4-choice) baseline: Qwen3-VL-4B + Unsloth QLoRA"
requires-python = ">=3.11,<3.13"
dependencies = [
    "unsloth",
    "trl",
    "peft",
    "safetensors",
    "pillow",
    "pandas",
    "numpy",
    "torch",
    "torchvision",
]

[project.scripts]
stv-train = "stv.train:main"
stv-infer = "stv.inference:main"
stv-bench = "stv.bench:main"
stv-ensemble = "stv.ensemble:main"

[dependency-groups]
eda = ["scipy", "scikit-learn", "matplotlib", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stv"]

# RTX 50xx (Blackwell) needs CUDA 12.8 wheels
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
